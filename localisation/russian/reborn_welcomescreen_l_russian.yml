 REBORN_WS_NYA:0 "[Root.GetNameDefCap]"
 REBORN_WS_NYA_desc:0 "ЭКНА - государство, которое возникло вопреки, ибо ныне населяющие эту страну неко-арки не раз подвергались унижениям на почве расы, что и сподвигло отца-основателя Маджимы основать страну ЭКНА, которая будет служить домом для неко-арк и оберегать их от коренных жителей всея Реборна. Но вместе с чувством унижения, неко-арки также держали в себе и ненависть ко всем, кто аналогично не был похож на них, из-за чего в стране довольно быстро с её зарождения начали популяризироваться разные экстремистские организации - от кружков по интересам до целых компаний по расизму. \n\nХоть и отец нации Маджима понимал, что в сердцах неко-арк пылала ненависть ко всем остальным, страна никак не могла просуществовать без внешних инвестиций в её экономику, чтобы в будущем стать самодостаточной, но этот процесс будет долгий и поэтому фюрер Маджима придумал план, по которому будет держать население в неведении и стараться пресечь любые утечки гос.дел о связях за рубежом. Данный период в народе назвали “Де-Т.О.К.С” Сокращенно от “Теневое открытие корпоративных сбережений”. Сделано это было с целью предотвращения активности разных экстремистских элементов в стране и сдерживанию их агрессии, которая могла бы похоронить настоящую “Буренья-мечту” уже в зачатке, узнав о том, что их родина контактирует с теми, кто совсем недавно оскорблял и унижал их соотечественников, а сейчас затмевают свой взор деньгами.\n\nВ плане армии, с ней не было проблем, если не считать ксенофобных солдатов, которые и составляли основной костяк Вооруженных Сил Корпуса Арк. Во время основания страны нашим отцом Маджимой, с ним также был один генерал, который имел немалый опыт в военных действий во время Грибных войн, которые разгорались на землях Реборна ранее. И лишь Маджима видел его лицо, ибо после основания и принятия первых граждан, они оба поняли, что в сердцах каждого неко-арка пылала ненависть ко всем остальным расам и с целью не разжигать конфликты внутри страны - он скрыл свое лицо под капюшоном, а при попытке какого-то солдата уличить генерала в том, что его кровь “Нечиста” - его арестовывали и сажали в одиночную камеру за то, что подозревает правительство в ксенофилии. \nГенерал также являлся фанатом бронетехники и был одним из первых, кто пожелал внедрить тактику превосходства бронированной техники на поле боя в страну, желая сохранить жизни своих чистокровных солдат. И по сей день, генерал продолжает выполнять свои обязанности и будет продолжать несмотря на изменения в “верхушке”, но некоторые радикальные солдаты, которые смогли дослужится до высших чинов, пытаются внедрить и свои тактики, которые по их мнению, могут быть эффективнее тактики “старого загадочника”.\n\nВ настоящее время, фюрер Маджима пропал после экспедиции в горы Гималаи в поисках соотечественников и его место занимает Комод - давний друг нашего лидера, который отличается чересчур пассивной политикой и политикой “умиротворения” чужих прихотей, жертвой которого стала наша законная территория, которая была богата разными рода минералами в попытке успокоить своих соседей, которые опасались наших граждан и нашего довольно быстрого роста в некоторых отраслях, включая в военном и промышленном. Из-за унижений перед другими нациями, население негодует сильнее и разные экстремистские элементы выходят на свет, действуя более открыто, заставляя ЭКНУ боятся за свое будущее"
