###ЭКНА


 NYA_Passive_Resistance: "Пассивное сопротивление"
 NYA_Passive_Resistance_desc: "После ряда неудачных реформ, население ЭКНА начало выражать своё недовольство правительством через пассивное сопротивление. Рабочие отказываются работать, студенты устраивают забастовки, а фермеры не хотят поставлять продовольствие в города. Это приводит к экономическому кризису и политической нестабильности в стране."
 NYA_Militarized_Society_Remains: "Остатки милитаризованного общество"
 NYA_Militarized_Society_Remains_desc: "Ещё до правления Комода, фюрер Маджима начал активно милитаризировать общество, чтобы подготовить страну к будущим конфликтам. Эта политика была приостановлена при нынешнем правлении и пытается перестроить общество в более миролюбивую форму."
 NYA_Ahnenerbe_start: "Влияние Аненербе"
 NYA_Ahnenerbe_start_desc: "Скрытое общество Аненербе, которое расположено в недрах ЭКНА, начинает оказывать влияние на правительство и армию, внедряя свои идеи и технологии в общество. Их цель - возрождение древних знаний и сил, чтобы сделать ЭКНА великой державой."
 NYA_Army_Mindclean: "Zомбификация армии"
 NYA_Army_Mindclean_desc: "Нет лучшего солдата, чем послушный солдат."

