 SSG_New_Step: "Новое время"
 SSG_Witchers_Problem: "Проблема с Ведьмаками"
 SSG_Witchers_Problem_desc: "Было довольно глупым решением присоединять их к СССГ, не удостоверившись в лояльности населения. Теперь вся страна усеяна гражданами из Ведьмачьего Королевства, которые не могут смирится с тем, что их страна так легко пала. Среди них, есть также и довольно радикальные лица, которые прибегают к террору населения, дабы обрести независимость, но этот путь лишь заставляет остальных жителей СССГ чувствовать ненависть к ним."
 SSG_Non_Loyality_People: "Непослушные граждане"
 SSG_Non_Loyality_People_desc: "Из-за нашей политики умиротворения в отношении к Ведьмакам, остальные гильдии сильно гневаются по этому поводу, считая, что мы с ними слишком мягки."
 SSG_Instability_Country: "Нестабильное государство"
 SSG_Instability_Country_desc: "Наша страна близка к распаду! Надо срочно что-нибудь предпринять и сохранить её!"
 


